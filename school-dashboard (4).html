<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة صهيب بن سنان المتوسطة</title>
<link rel="icon" type="image/png" id="faviconLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<!-- Firebase (used as the real cloud backend so the site works when hosted outside Claude) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --primary:#1F4B43;
    --primary-dark:#123832;
    --primary-soft:#E8F0EC;
    --accent:#C9A227;
    --accent-light:#E7CE7C;
    --bg:#FBF8F1;
    --surface:#FFFFFF;
    --ink:#1C2321;
    --ink-soft:#5C665F;
    --border:#E4DCC8;
    --danger:#B4483C;
    --radius:14px;
    --font-display:'Aref Ruqaa', serif;
    --font-body:'Tajawal', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    line-height:1.7;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}
  .arch{
    width:34px;height:34px;flex:none;
  }
  .logo-img{height:44px;width:auto;flex:none;object-fit:contain;}
  .logo-img-lg{height:64px;width:auto;margin:0 auto 14px;display:block;object-fit:contain;}
  .logo-img-sm{height:34px;width:auto;object-fit:contain;margin-bottom:8px;}
  /* ---------- Top Nav ---------- */
  header.site-header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:40;
  }
  .nav-wrap{
    max-width:1180px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:none;}
  .brand-name{font-family:var(--font-display);font-size:22px;color:var(--primary-dark);font-weight:700;line-height:1.2;}
  .brand-sub{font-size:11px;color:var(--ink-soft);letter-spacing:.5px;}
  nav.main-links{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:0;}
  .page-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  nav.main-links a, nav.main-links button.navbtn{
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500;
    color:var(--ink-soft);border:none;background:transparent;white-space:nowrap;
  }
  nav.main-links a.active, nav.main-links button.navbtn.active{background:var(--primary-soft);color:var(--primary-dark);}
  nav.main-links a:hover, nav.main-links button.navbtn:hover{color:var(--primary-dark);}
  .login-pill{
    background:var(--primary)!important;color:#fff!important;padding:10px 22px!important;border-radius:999px;
    font-weight:700!important;box-shadow:0 4px 14px rgba(31,75,67,.25);flex:none;white-space:nowrap;
  }
  .login-pill:hover{background:var(--primary-dark)!important;}
  @media(max-width:700px){
    .nav-wrap{flex-direction:column;align-items:stretch;gap:12px;}
    .brand{justify-content:center;}
    nav.main-links{justify-content:center;width:100%;}
    .page-links{justify-content:center;width:100%;}
    .login-pill{width:100%;text-align:center;order:99;}
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 85% 20%, rgba(201,162,39,.16), transparent 45%),
      linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;padding:86px 24px 110px;
  }
  .hero-pattern{
    position:absolute;inset:0;opacity:.10;
    background-image:
      linear-gradient(45deg, transparent 48%, #fff 49%, #fff 51%, transparent 52%),
      linear-gradient(-45deg, transparent 48%, #fff 49%, #fff 51%, transparent 52%);
    background-size:46px 46px;
  }
  .hero-inner{position:relative;max-width:900px;margin:0 auto;text-align:center;}
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:1px;color:var(--accent-light);
    border:1px solid rgba(231,206,124,.4);padding:6px 16px;border-radius:999px;margin-bottom:22px;
  }
  .hero h1{font-family:var(--font-display);font-size:clamp(32px,5vw,52px);margin:0 0 18px;font-weight:700;}
  .hero p.sub{font-size:18px;color:#EFE7CF;max-width:620px;margin:0 auto 34px;}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{padding:13px 28px;border-radius:999px;font-weight:600;font-size:15px;border:2px solid transparent;transition:.15s;}
  .btn-gold{background:var(--accent);color:var(--primary-dark);}
  .btn-gold:hover{background:var(--accent-light);}
  .btn-outline{border-color:rgba(255,255,255,.5);color:#fff;}
  .btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.08);}
  .arch-divider{
    position:relative;height:46px;margin-top:-46px;
  }
  .arch-divider svg{width:100%;height:100%;display:block;}

  /* ---------- Sections ---------- */
  .section{max-width:1180px;margin:0 auto;padding:64px 24px;}
  .section-head{text-align:center;max-width:640px;margin:0 auto 40px;}
  .eyebrow{font-size:12.5px;letter-spacing:1.5px;color:var(--accent);font-weight:700;text-transform:uppercase;}
  .section-head h2{font-family:var(--font-display);font-size:32px;margin:8px 0 10px;color:var(--primary-dark);}
  .section-head p{color:var(--ink-soft);font-size:15.5px;}

  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;}
  @media(max-width:820px){.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px;transition:.15s;
  }
  .card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(31,75,67,.08);}
  .card .icon-badge{
    width:44px;height:44px;border-radius:12px;background:var(--primary-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--primary);
  }
  .card h3{margin:0 0 8px;font-size:18px;color:var(--primary-dark);}
  .card p{margin:0;color:var(--ink-soft);font-size:14.5px;}
  .card .meta{font-size:12.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .card img.thumb{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:14px;background:var(--primary-soft);}

  .stats-strip{background:var(--primary-soft);border-radius:var(--radius);padding:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center;}
  @media(max-width:820px){.stats-strip{grid-template-columns:1fr 1fr;}}
  .stats-strip .num{font-family:var(--font-display);font-size:34px;color:var(--primary-dark);font-weight:700;}
  .stats-strip .lbl{font-size:13px;color:var(--ink-soft);}

  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.gallery{grid-template-columns:repeat(2,1fr);}}
  .gallery img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:var(--primary-soft);}

  footer.site-footer{background:var(--primary-dark);color:#EFE7CF;padding:40px 24px 24px;margin-top:40px;}
  .footer-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}
  .footer-inner .fcol h4{color:#fff;font-size:15px;margin:0 0 10px;}
  .footer-inner .fcol p, .footer-inner .fcol a{font-size:13.5px;color:#C9CFC9;display:block;margin-bottom:6px;}
  .footer-bottom{text-align:center;font-size:12px;color:#7F978F;margin-top:26px;border-top:1px solid rgba(255,255,255,.08);padding-top:18px;}

  /* ---------- Auth / Login ---------- */
  .auth-wrap{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .auth-card{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:40px 34px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(31,75,67,.08);
  }
  .auth-card .arch{margin:0 auto 14px;display:block;}
  .auth-card h2{font-family:var(--font-display);text-align:center;color:var(--primary-dark);font-size:24px;margin:0 0 4px;}
  .auth-card p.hint{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);
    font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:90px;}
  .auth-submit{width:100%;padding:12px;border-radius:10px;background:var(--primary);color:#fff;border:none;font-weight:700;font-size:15px;margin-top:6px;}
  .auth-submit:hover{background:var(--primary-dark);}
  .auth-err{background:#FBEAE7;color:var(--danger);border:1px solid #F1C6BE;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
  .auth-demo{margin-top:20px;background:var(--primary-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--primary-dark);text-align:center;}

  /* ---------- Dashboard ---------- */
  .dash-shell{display:flex;min-height:calc(100vh - 68px);}
  .dash-sidebar{
    width:250px;flex:none;background:var(--primary-dark);color:#EFE7CF;
    padding:22px 14px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;
  }
  .dash-user{padding:10px 12px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
  .dash-user .uname{font-weight:700;color:#fff;font-size:14.5px;}
  .dash-user .urole{font-size:12px;color:var(--accent-light);}
  .dash-nav button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 12px;
    border-radius:10px;background:transparent;border:none;color:#D9E3DD;font-size:14px;margin-bottom:2px;
  }
  .dash-nav button:hover{background:rgba(255,255,255,.06);}
  .dash-nav button.active{background:var(--accent);color:var(--primary-dark);font-weight:700;}
  .dash-logout{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);}
  .dash-logout button{width:100%;padding:10px;border-radius:10px;background:rgba(180,72,60,.18);color:#F5B8B0;border:none;font-weight:600;}
  .dash-logout button:hover{background:rgba(180,72,60,.3);}
  .dash-main{flex:1;padding:34px 38px;max-width:980px;}
  .dash-head{margin-bottom:26px;}
  .dash-head h1{font-family:var(--font-display);font-size:28px;color:var(--primary-dark);margin:0 0 4px;}
  .dash-head p{color:var(--ink-soft);font-size:14px;margin:0;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:22px;}
  .panel h3{margin:0 0 16px;font-size:16.5px;color:var(--primary-dark);}
  .row-flex{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row-flex .field{flex:1;min-width:180px;}
  .btn-primary{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:9px;font-weight:600;font-size:14px;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;border:1.5px solid var(--border);padding:9px 18px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary-dark);}
  .btn-danger{background:transparent;border:1.5px solid #F1C6BE;color:var(--danger);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;}
  .btn-danger:hover{background:#FBEAE7;}
  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th{text-align:right;color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:2px solid var(--border);}
  table.data-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-admin{background:var(--accent-light);color:var(--primary-dark);}
  .badge-normal{background:var(--primary-soft);color:var(--primary-dark);}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
  .list-item:last-child{border-bottom:none;}
  .list-item .info{flex:1;}
  .list-item .info .t{font-weight:700;font-size:14.5px;color:var(--ink);}
  .list-item .info .d{font-size:12.5px;color:var(--ink-soft);}
  .list-item .actions{display:flex;gap:8px;}
  .perm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;}
  .perm-check{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;}
  .perm-check input{width:16px;height:16px;}
  .empty-state{text-align:center;padding:36px 16px;color:var(--ink-soft);font-size:14px;}
  .home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:720px){.home-cards{grid-template-columns:1fr;}.dash-shell{flex-direction:column;}.dash-sidebar{width:100%;height:auto;position:relative;top:0;}}
  .thumb-sm{width:60px;height:44px;object-fit:cover;border-radius:6px;background:var(--primary-soft);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--primary-dark);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:999;opacity:0;transition:opacity .25s, bottom .25s;pointer-events:none;
  }
  .toast.show{opacity:1;bottom:34px;}
  .toast.err{background:var(--danger);}
  .loading-note{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .notice{background:#FFF6DE;border:1px solid #EFDFA0;color:#7A5E00;font-size:12.5px;padding:10px 14px;border-radius:10px;margin-bottom:18px;}

  /* Confirm modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(28,35,33,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .modal-box{background:#fff;border-radius:16px;padding:26px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-box p{margin:0 0 20px;font-size:14.5px;color:var(--ink);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  /* Mobile dashboard toggle */
  .dash-toggle{display:none;}
  @media(max-width:720px){
    .dash-toggle{
      display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;
      padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;margin:14px 20px 0;
    }
    .dash-sidebar{display:none;}
    .dash-sidebar.open{display:block;position:fixed;inset:68px 0 0 0;height:calc(100vh - 68px);z-index:50;width:100%;}
  }

  /* Homepage features */
  .feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  @media(max-width:820px){.feat-grid{grid-template-columns:repeat(2,1fr);}}
  .feat-card{text-align:center;padding:22px 14px;}
  .feat-card .icon-badge{margin:0 auto 12px;}

  /* Profile / password panel */
  .inline-note{font-size:12.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================= FIREBASE (real cloud backend) =============================
   لتشغيل الموقع خارج بيئة Claude (مثل GitHub Pages)، عبّي بيانات مشروع Firebase الخاص فيك هنا.
   إذا تركتها كما هي (بدون تعبئة)، الموقع يستمر يشتغل بالوضع التجريبي الحالي فقط داخل هذه المحادثة.
   طريقة الحصول على هذه البيانات موضحة في الرسالة المرفقة معي بالمحادثة. */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

let firebaseReady = false;
let db = null;
let auth = null;
try{
  if(firebaseConfig.apiKey && firebaseConfig.projectId && typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    firebaseReady = true;
  }
}catch(e){ console.error('Firebase init failed, falling back to local mode', e); firebaseReady = false; }

/* Firebase Authentication uses email/password. Our app uses plain usernames, so we
   derive a stable, unique, ASCII-safe synthetic email from any username (Arabic or Latin). */
function usernameToEmail(username){
  const clean = (username||'').trim().toLowerCase();
  let hash = 0;
  for(let i=0;i<clean.length;i++){ hash = ((hash<<5)-hash+clean.charCodeAt(i))|0; }
  const asciiPart = clean.replace(/[^a-z0-9]+/g,'').slice(0,24);
  const local = 'u' + Math.abs(hash).toString(36) + (asciiPart?('.'+asciiPart):'');
  return local + '@suhaib-school.local';
}

/* Creates a new Firebase Auth account without disturbing the currently signed-in
   admin's session (client SDKs normally sign in whoever was just created). */
async function createFirebaseUserWithoutSignOut(email, password){
  const secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary_' + Date.now());
  try{
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
    const newUid = cred.user.uid;
    await secondaryApp.auth().signOut();
    await secondaryApp.delete();
    return newUid;
  }catch(e){
    try{ await secondaryApp.delete(); }catch(_e){}
    throw e;
  }

/* In-memory fallback store: guarantees the app keeps working (for this session)
   even if window.storage is unavailable or a call fails for any reason. */
const __mem = {};
function memKey(key, shared){ return (shared?'shared:':'user:') + key; }

async function safeGet(key, shared){
  if(firebaseReady && db){
    try{
      const snap = await db.collection('app_data').doc(key).get();
      const v = snap.exists ? JSON.parse(snap.data().json) : null;
      if(v!==null) __mem[memKey(key,shared)] = JSON.stringify(v);
      return v;
    }catch(e){ console.error('Firestore get failed, using local fallback', e); }
  }
  try{
    if(window.storage){
      const r = await window.storage.get(key, shared);
      if(r) return JSON.parse(r.value);
    }
  }catch(e){ /* fall through to memory cache */ }
  const mk = memKey(key, shared);
  return __mem.hasOwnProperty(mk) ? JSON.parse(__mem[mk]) : null;
}
async function safeSet(key, value, shared){
  const mk = memKey(key, shared);
  __mem[mk] = JSON.stringify(value); // always keep a working local copy
  if(firebaseReady && db){
    try{
      await db.collection('app_data').doc(key).set({json: JSON.stringify(value), updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('Firestore set failed, using local fallback', e); }
  }
  try{
    if(window.storage){ await window.storage.set(key, JSON.stringify(value), shared); }
    return true;
  }catch(e){
    console.error('persistent storage set failed, using in-memory fallback', e);
    return true; // still succeeded locally, app stays usable
  }
}

function defaultPermissions(all){
  const p = {};
  MANAGE_SECTIONS.forEach(s=>p[s.key]=!!all);
  return p;
}

/* ---- School roles & their default permission templates ----
   These map to the sections already defined in SECTION_DEFS/MANAGE_SECTIONS above.
   Admin can still fine-tune any individual user's permissions after picking a role. */
const ROLE_DEFAULTS = {

  'وكيل': (()=>{ const p = defaultPermissions(false);

    return p; })(),

/* ---- Generic Firestore collection helpers (classes / subjects / announcements, etc.) ----
   Only meaningful once Firebase is connected; these features are not available in local/demo mode
   because they need proper multi-record querying that the single-document fallback can't provide. */
async function fsList(collectionName){
  if(!(firebaseReady && db)) return null;
  try{
    const snap = await db.collection(collectionName).orderBy('createdAt','desc').get();
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error('fsList failed', collectionName, e); return []; }
}
async function fsAdd(collectionName, data){
  if(!(firebaseReady && db)) return null;
  const ref = await db.collection(collectionName).add({...data, createdAt: Date.now()});
  return ref.id;
}
async function fsUpdate(collectionName, id, data){
  if(!(firebaseReady && db)) return false;
  await db.collection(collectionName).doc(id).update(data);
  return true;
}
async function fsDelete(collectionName, id){
  if(!(firebaseReady && db)) return false;
  await db.collection(collectionName).doc(id).delete();
  return true;
}

/* ---- Per-user profile helpers: users/{uid} — one document per account, keyed by the
   Firebase Auth UID. This (rather than one big array) is what makes tight, per-user
   Firestore security rules possible. Only used in Firebase mode. */
async function fsGetUserProfile(uidVal){
  if(!(firebaseReady && db)) return null;
  try{ const doc = await db.collection('users').doc(uidVal).get(); return doc.exists ? {id:doc.id, ...doc.data()} : null; }
  catch(e){ console.error('fsGetUserProfile failed', e); return null; }
}
async function fsSetUserProfile(uidVal, data){
  if(!(firebaseReady && db)) return false;
  try{ await db.collection('users').doc(uidVal).set(data, {merge:true}); return true; }
  catch(e){ console.error('fsSetUserProfile failed', e); return false; }
}
async function fsListUsers(){
  if(!(firebaseReady && db)) return null;
  try{ const snap = await db.collection('users').get(); return snap.docs.map(d=>({id:d.id, ...d.data()})); }
  catch(e){ console.error('fsListUsers failed', e); return []; }
}
async function fsDeleteUserProfile(uidVal){
  if(!(firebaseReady && db)) return false;
  try{ await db.collection('users').doc(uidVal).delete(); return true; }
  catch(e){ console.error('fsDeleteUserProfile failed', e); return false; }
}

        {id:uid('prog'), title:'الأنشطة اللاصفية', description:'أندية طلابية في الرياضة والتقنية والفنون لصقل مهارات الطلاب.'}
      ],
      news:[
        {id:uid('news'), title:'انطلاق العام الدراسي الجديد', date:new Date().toISOString().slice(0,10), body:'أعلنت إدارة المدرسة عن استعدادها لاستقبال الطلاب في العام الدراسي الجديد وفق خطة تشغيلية متكاملة.'}
      ],
      images:[]
    };
    await safeSet(STORAGE_KEYS.content, content, true);
  }
  let log = await safeGet(STORAGE_KEYS.log, true);
  if(!log){ await safeSet(STORAGE_KEYS.log, [], true); }
}

async function loadAll(){
  const [firebaseUsers, content, log] = await Promise.all([
    firebaseReady ? fsListUsers() : safeGet(STORAGE_KEYS.users, true),
    safeGet(STORAGE_KEYS.content, true),
    safeGet(STORAGE_KEYS.log, true)
  ]);
  return { users: firebaseUsers||[], content: content||{}, log: log||[] };
}

async function pushLog(actorName, action){
  const log = await safeGet(STORAGE_KEYS.log, true) || [];
  log.unshift({ id:uid('log'), time:new Date().toISOString(), actor:actorName, action });
  await safeSet(STORAGE_KEYS.log, log.slice(0,300), true);
}

/* ============================= APP STATE ============================= */
const state = {
  view:'home',           // home | about | programs | news | contact | login | dashboard
  dashSection:'home',
  currentUser:null,       // in-memory session only, resets on reload
  data:null,
  loading:true,
  loginError:'',
  editTarget:null,        // {type:'news'|'prog'|'image'|<collectionName>, id} when editing an existing item
  sidebarOpen:false,      // mobile dashboard sidebar toggle
  pwError:'', pwSuccess:'',
  collections:{}          // lazy-loaded Firestore collections cache: {classes:{loading,items}, subjects:{...}, announcements:{...}}
};

function showConfirm(message, onConfirm){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal-box">
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn-ghost" type="button" id="modalCancelBtn">إلغاء</button>
        <button class="btn-danger" type="button" id="modalConfirmBtn">تأكيد الحذف</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#modalCancelBtn').addEventListener('click', ()=> wrap.remove());
  wrap.querySelector('#modalConfirmBtn').addEventListener('click', ()=>{ wrap.remove(); onConfirm(); });
}

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (isErr?' err':'');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.className='toast'; }, 2600);
}

async function refreshData(silent){
  const data = await loadAll();
  state.data = data;
  state.loading = false;
  render();
}

async function boot(){
  try{
    const favicon = document.getElementById('faviconLink');
    if(favicon) favicon.href = SCHOOL_LOGO;
    await seedIfNeeded();
    await refreshData();
  }catch(e){
    console.error('boot failed', e);
    state.loading = false;
    document.getElementById('app').innerHTML =
      `<div class="loading-note">حدث خطأ أثناء تحميل الموقع. حاول تحديث الصفحة. (${esc(e.message||e)})</div>`;
    return;
  }

  if(firebaseReady && db){
    // real-time sync: any change from any visitor/admin reflects instantly for everyone
    db.collection('app_data').doc(STORAGE_KEYS.content).onSnapshot(snap=>{
      if(snap.exists && state.data){ state.data.content = JSON.parse(snap.data().json); render(); }
    }, err=> console.error('content listener error', err));
    db.collection('users').onSnapshot(snap=>{
      if(state.data){ state.data.users = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }
    }, err=> console.error('users listener error', err));
    db.collection('app_data').doc(STORAGE_KEYS.log).onSnapshot(snap=>{
      if(snap.exists && state.data){ state.data.log = JSON.parse(snap.data().json); if(state.dashSection==='log') render(); }
    }, err=> console.error('log listener error', err));
  } else {
    // light polling fallback so content edits still feel live within the Claude environment
    setInterval(async ()=>{
      try{
        const fresh = await loadAll();
        const changed = JSON.stringify(fresh.content) !== JSON.stringify(state.data && state.data.content);
        state.data = fresh;
        if(changed) render();
      }catch(e){ console.error('refresh poll failed', e); }
    }, 4000);
  }
}
window.addEventListener('error', (e)=>{ console.error('unhandled error', e.error||e.message); });
window.addEventListener('unhandledrejection', (e)=>{ console.error('unhandled rejection', e.reason); });

/* ============================= HELPERS ============================= */
function hasPerm(user, key){
  if(!user) return false;
  if(user.protected) return true;
  return !!(user.permissions && user.permissions[key]);
}
function arch(color){
  color = color || 'currentColor';
  return `<svg class="arch" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 36V20C6 11.16 12.16 5 20 5C27.84 5 34 11.16 34 20V36" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 5V36" stroke="${color}" stroke-width="1.2" stroke-opacity=".4"/>
    <circle cx="20" cy="15" r="2.2" fill="${color}"/>
  </svg>`;
}
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString('ar-SA', {year:'numeric', month:'long', day:'numeric'}); }
  catch(e){ return iso; }
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= ROUTER RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div class="loading-note">جارِ تحميل بيانات الموقع…</div>`; return; }

  if(state.view === 'dashboard' && state.currentUser){
    app.innerHTML = renderHeader() + renderDashboard();
  } else if(state.view === 'login'){
    app.innerHTML = renderHeader() + renderLogin();
  } else {
    app.innerHTML = renderHeader() + renderPublic() + renderFooter();
  }
  bindEvents();
}

/* ---------- Generic Firestore-collection management (classes / subjects / announcements) ----------
   These only work once Firebase is connected — they need real multi-record queries that the
   single-document local/demo mode can't provide. Loaded lazily into state.collections[name]. */
async function ensureCollectionLoaded(name){
  if(!(firebaseReady && db)) return;
  if(!state.collections) state.collections = {};
  if(state.collections[name]) return; // already loaded/loading
  state.collections[name] = { loading:true, items:[] };
  render();
  const items = await fsList(name);
  state.collections[name] = { loading:false, items: items||[] };
  render();
}

/* ============================= EVENTS ============================= */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      const v = el.getAttribute('data-nav');
      if(v==='dashboard' && !state.currentUser){ state.view='login'; }
      else { state.view = v; state.loginError=''; if(v==='dashboard') state.dashSection='home'; }
      window.scrollTo(0,0);
      render();
    });
  });

  const loginSubmitBtn = document.getElementById('loginSubmitBtn');
  const loginUsername = document.getElementById('loginUsername');
  const loginPassword = document.getElementById('loginPassword');
  if(loginSubmitBtn){
    const doLogin = async ()=>{
      const username = (loginUsername.value||'').toString().trim();
      const password = (loginPassword.value||'').toString().trim();
      if(!username || !password){
        state.loginError = 'الرجاء تعبئة اسم المستخدم وكلمة المرور';
        render();
        return;
      }
      if(firebaseReady && auth){
        try{
          const email = usernameToEmail(username);
          const cred = await auth.signInWithEmailAndPassword(email, password);
          const profile = await fsGetUserProfile(cred.user.uid);
          if(!profile){
            await auth.signOut();
            state.loginError = 'الحساب غير مفعّل أو تم إلغاؤه. تواصل مع المدير.';
            render();
            return;
          }
          state.currentUser = profile;
          state.view='dashboard'; state.dashSection='home'; state.loginError='';
          render();
          toast('تم تسجيل الدخول بنجاح');
        }catch(e){
          console.error('Firebase login failed', e);
          state.loginError = 'اسم المستخدم أو كلمة المرور غير صحيحة';
          render();
        }
        return;
      }
      const users = (state.data && state.data.users) || [];
      const found = users.find(u=>u.username===username && u.password===password);
      if(found){
        state.currentUser = found;
        state.view='dashboard'; state.dashSection='home'; state.loginError='';
        render();
        toast('تم تسجيل الدخول بنجاح');
      } else {
        state.loginError = 'اسم المستخدم أو كلمة المرور غير صحيحة';
        render();
      }
    };
    loginSubmitBtn.addEventListener('click', doLogin);
    [loginUsername, loginPassword].forEach(inp=>{
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } });
    });
  }

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', async ()=>{
      if(firebaseReady && auth){ try{ await auth.signOut(); }catch(e){ console.error(e); } }
      state.currentUser = null; state.view='home'; render();
    });
  }

  document.querySelectorAll('[data-dash]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.dashSection = el.getAttribute('data-dash');
      state.editTarget = null;
      state.sidebarOpen = false;
      render();
    });
  });

  const sidebarToggle = document.getElementById('sidebarToggle');
  if(sidebarToggle) sidebarToggle.addEventListener('click', ()=>{ state.sidebarOpen = !state.sidebarOpen; render(); });

  const changePwBtn = document.getElementById('changePwBtn');
  if(changePwBtn) changePwBtn.addEventListener('click', async ()=>{
    const actor = state.currentUser ? (state.currentUser.name||state.currentUser.username) : '—';
    const cur = document.getElementById('pwCurrent').value;
    const next = document.getElementById('pwNew').value;
    const conf = document.getElementById('pwConfirm').value;
    state.pwSuccess = '';
    if(!next || next.length < 4){ state.pwError = 'كلمة المرور الجديدة يجب ألا تقل عن 4 أحرف'; render(); return; }
    if(next !== conf){ state.pwError = 'كلمة المرور الجديدة غير متطابقة مع التأكيد'; render(); return; }

    if(firebaseReady && auth){
      try{
        const email = usernameToEmail(state.currentUser.username);
        const credential = firebase.auth.EmailAuthProvider.credential(email, cur);
        await auth.currentUser.reauthenticateWithCredential(credential);
        await auth.currentUser.updatePassword(next);
        state.pwError=''; state.pwSuccess='تم تحديث كلمة المرور بنجاح';
        await pushLog(actor, 'تحديث كلمة المرور الشخصية');
        toast('تم تحديث كلمة المرور');
        render();
      }catch(e){
        console.error('password update failed', e);
        state.pwError = 'كلمة المرور الحالية غير صحيحة';
        render();
      }
      return;
    }

    if(cur !== state.currentUser.password){ state.pwError = 'كلمة المرور الحالية غير صحيحة'; render(); return; }
    const idx = state.data.users.findIndex(x=>x.id===state.currentUser.id);
    if(idx>-1){
      state.data.users[idx].password = next;
      const ok = await safeSet(STORAGE_KEYS.users, state.data.users, true);
      if(ok){
        state.currentUser = state.data.users[idx];
        state.pwError=''; state.pwSuccess='تم تحديث كلمة المرور بنجاح';
        await pushLog(actor, 'تحديث كلمة المرور الشخصية');
        toast('تم تحديث كلمة المرور');
      }
    }
    await refreshData();
  });

  bindDashForms2();
}

function bindDashForms2(){
  const u = state.currentUser;
  const actor = u ? (u.name||u.username) : '—';

  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{ state.editTarget = null; render(); });

  const homepageForm = document.getElementById('homepageForm');
  if(homepageForm) homepageForm.querySelector('button').addEventListener('click', async (e)=>{
    e.preventDefault();
    const fd = new FormData(homepageForm);
    state.data.content.home = {
      heroTitle: fd.get('heroTitle')||'', heroSubtitle: fd.get('heroSubtitle')||'', heroImage: fd.get('heroImage')||''
    };
    await saveContent('تعديل محتوى الصفحة الرئيسية', actor);
  });

  const imageAddForm = document.getElementById('imageAddForm');
  if(imageAddForm){
    const urlInput = document.getElementById('imageUrlInput');
    const previewWrap = document.getElementById('imagePreviewWrap');
    const updatePreview = ()=>{
      const url = urlInput.value.trim();
      previewWrap.innerHTML = url ? `<img class="thumb-sm" style="width:100px;height:70px;margin-bottom:12px;" src="${url.replace(/"/g,'&quot;')}" alt="" onerror="this.style.display='none'">` : '';
    };
    urlInput.addEventListener('input', updatePreview);
    updatePreview();

    imageAddForm.querySelector('button.btn-primary').addEventListener('click', async (e)=>{
      e.preventDefault();
      const fd = new FormData(imageAddForm);
      if(!fd.get('url')){ toast('الرجاء إدخال رابط الصورة', true); return; }
      state.data.content.images = state.data.content.images||[];
      const editingId = state.editTarget && state.editTarget.type==='image' ? state.editTarget.id : null;
      if(editingId){
        const idx = state.data.content.images.findIndex(i=>i.id===editingId);
        if(idx>-1) state.data.content.images[idx] = {...state.data.content.images[idx], url:fd.get('url'), caption:fd.get('caption')};
        state.editTarget = null;
        await saveContent('تعديل صورة', actor);
      } else {
        state.data.content.images.push({id:uid('img'), url:fd.get('url'), caption:fd.get('caption')});
        await saveContent('إضافة صورة جديدة', actor);
      }
    });
  }
  document.querySelectorAll('[data-edit-image]').forEach(btn=>btn.addEventListener('click', ()=>{
    state.editTarget = {type:'image', id: btn.getAttribute('data-edit-image')};
    render();
  }));
  document.querySelectorAll('[data-del-image]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.getAttribute('data-del-image');
    showConfirm('هل تريد حذف هذه الصورة؟', async ()=>{
      state.data.content.images = (state.data.content.images||[]).filter(i=>i.id!==id);
      await saveContent('حذف صورة', actor);
    });
  }));

  const newsAddForm = document.getElementById('newsAddForm');
  if(newsAddForm) newsAddForm.querySelector('button.btn-primary').addEventListener('click', async (e)=>{
    e.preventDefault();
    const fd = new FormData(newsAddForm);
    if(!fd.get('title') || !fd.get('body')){ toast('الرجاء تعبئة عنوان ونص الخبر', true); return; }
    state.data.content.news = state.data.content.news||[];
    const editingId = state.editTarget && state.editTarget.type==='news' ? state.editTarget.id : null;
    if(editingId){
      const idx = state.data.content.news.findIndex(n=>n.id===editingId);
      if(idx>-1) state.data.content.news[idx] = {...state.data.content.news[idx], title:fd.get('title'), date:fd.get('date'), image:fd.get('image'), body:fd.get('body')};
      state.editTarget = null;
      await saveContent('تعديل خبر: ' + fd.get('title'), actor);
    } else {
      state.data.content.news.unshift({id:uid('news'), title:fd.get('title'), date:fd.get('date'), image:fd.get('image'), body:fd.get('body')});
      await saveContent('نشر خبر: ' + fd.get('title'), actor);
    }
  });
  document.querySelectorAll('[data-edit-news]').forEach(btn=>btn.addEventListener('click', ()=>{
    state.editTarget = {type:'news', id: btn.getAttribute('data-edit-news')};
    render();
  }));
  document.querySelectorAll('[data-del-news]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.getAttribute('data-del-news');
    showConfirm('هل تريد حذف هذا الخبر؟', async ()=>{
      state.data.content.news = (state.data.content.news||[]).filter(n=>n.id!==id);
      await saveContent('حذف خبر', actor);
    });
  }));

  const progAddForm = document.getElementById('progAddForm');
  if(progAddForm) progAddForm.querySelector('button.btn-primary').addEventListener('click', async (e)=>{
    e.preventDefault();
    const fd = new FormData(progAddForm);
    if(!fd.get('title') || !fd.get('description')){ toast('الرجاء تعبئة اسم ووصف البرنامج', true); return; }
    state.data.content.programs = state.data.content.programs||[];
    const editingId = state.editTarget && state.editTarget.type==='prog' ? state.editTarget.id : null;
    if(editingId){
      const idx = state.data.content.programs.findIndex(p=>p.id===editingId);
      if(idx>-1) state.data.content.programs[idx] = {...state.data.content.programs[idx], title:fd.get('title'), description:fd.get('description'), image:fd.get('image')};
      state.editTarget = null;
      await saveContent('تعديل برنامج: ' + fd.get('title'), actor);
    } else {
      state.data.content.programs.push({id:uid('prog'), title:fd.get('title'), description:fd.get('description'), image:fd.get('image')});
      await saveContent('إضافة برنامج: ' + fd.get('title'), actor);
    }
  });
  document.querySelectorAll('[data-edit-prog]').forEach(btn=>btn.addEventListener('click', ()=>{
    state.editTarget = {type:'prog', id: btn.getAttribute('data-edit-prog')};
    render();
  }));
  document.querySelectorAll('[data-del-prog]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.getAttribute('data-del-prog');
    showConfirm('هل تريد حذف هذا البرنامج؟', async ()=>{
      state.data.content.programs = (state.data.content.programs||[]).filter(p=>p.id!==id);
      await saveContent('حذف برنامج', actor);
    });
  }));

  const textsForm = document.getElementById('textsForm');
  if(textsForm) textsForm.querySelector('button').addEventListener('click', async (e)=>{
    e.preventDefault();
    const fd = new FormData(textsForm);
    state.data.content.texts = {about: fd.get('about')||'', footer: fd.get('footer')||''};
    await saveContent('تعديل النصوص العامة', actor);
  });

  const schoolForm = document.getElementById('schoolForm');
  if(schoolForm) schoolForm.querySelector('button').addEventListener('click', async (e)=>{
    e.preventDefault();
    const fd = new FormData(schoolForm);
    const s = {};
    ['name','motto','founded','stage','principal','studentsCount','teachersCount','address','phone','email'].forEach(k=>s[k]=fd.get(k)||'');
    state.data.content.school = s;
    await saveContent('تعديل بيانات المدرسة', actor);
  });

  const roleSelect = document.getElementById('roleSelect');
  if(roleSelect){
    roleSelect.addEventListener('change', ()=>{
      const defaults = ROLE_DEFAULTS[roleSelect.value] || {};
      MANAGE_SECTIONS.forEach(s=>{
        const chk = document.querySelector(`input[name="perm_${s.key}"]`);
        if(chk) chk.checked = !!defaults[s.key];
      });
    });
  }

  const userAddForm = document.getElementById('userAddForm');
  if(userAddForm) userAddForm.querySelector('button').addEventListener('click', async (e)=>{
    e.preventDefault();
    const fd = new FormData(userAddForm);
    const username = (fd.get('username')||'').toString().trim();
    const password = (fd.get('password')||'').toString();
    if(!username || !password || !fd.get('name')){ toast('الرجاء تعبئة الاسم واسم المستخدم وكلمة المرور', true); return; }
    if((state.data.users||[]).some(x=>x.username.toLowerCase()===username.toLowerCase())){
      toast('اسم المستخدم موجود مسبقاً', true); return;
    }
    const permissions = {};
    MANAGE_SECTIONS.forEach(s=>permissions[s.key] = fd.get('perm_'+s.key)==='on');
    const role = fd.get('role') || ROLE_NAMES[ROLE_NAMES.length-1];

    if(firebaseReady && auth){
      try{
        const email = usernameToEmail(username);
        const newUid = await createFirebaseUserWithoutSignOut(email, password);
        const ok = await fsSetUserProfile(newUid, { username, name: fd.get('name'), role, permissions, protected:false });
        if(ok){ await pushLog(actor, 'إنشاء حساب جديد: ' + username); toast('تم إنشاء الحساب'); }
        await refreshData();
      }catch(err){
        console.error('create firebase user failed', err);
        toast('تعذر إنشاء الحساب: ' + (err.message||err), true);
      }
      return;
    }

    const newUser = { id: uid('u'), username, password, name: fd.get('name'), role, permissions };
    state.data.users = state.data.users||[];
    state.data.users.push(newUser);
    const ok = await safeSet(STORAGE_KEYS.users, state.data.users, true);
    if(ok){ await pushLog(actor, 'إنشاء حساب جديد: ' + username); toast('تم إنشاء الحساب'); }
    await refreshData();
  });
  document.querySelectorAll('[data-del-user]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.getAttribute('data-del-user');
    const msg = firebaseReady
      ? 'سيتم إلغاء وصول هذا المستخدم للوحة التحكم فورًا. متابعة؟'
      : 'هل تريد حذف هذا المستخدم؟';
    showConfirm(msg, async ()=>{
      if(firebaseReady){
        const ok = await fsDeleteUserProfile(id);
        if(ok){ await pushLog(actor, 'حذف حساب مستخدم'); toast('تم الحذف'); }
        await refreshData();
        return;
      }
      state.data.users = (state.data.users||[]).filter(x=>x.id!==id);
      const ok = await safeSet(STORAGE_KEYS.users, state.data.users, true);
      if(ok){ await pushLog(actor, 'حذف حساب مستخدم'); toast('تم الحذف'); }
      await refreshData();
    });
  }));


  const savePermsBtn = document.getElementById('savePermsBtn');
  if(savePermsBtn) savePermsBtn.addEventListener('click', async ()=>{
    document.querySelectorAll('[data-perm-user]').forEach(chk=>{
      const uidVal = chk.getAttribute('data-perm-user');
      const key = chk.getAttribute('data-perm-key');
      const usr = state.data.users.find(x=>x.id===uidVal);
      if(usr){ usr.permissions = usr.permissions||{}; usr.permissions[key] = chk.checked; }
    });
    if(firebaseReady){
      const nonProtected = state.data.users.filter(u=>!u.protected);
      try{
        await Promise.all(nonProtected.map(u=>fsSetUserProfile(u.id, {permissions:u.permissions})));
        await pushLog(actor, 'تحديث صلاحيات المستخدمين');
        toast('تم حفظ الصلاحيات');
      }catch(err){
        console.error('save permissions failed', err);
        toast('تعذر حفظ الصلاحيات: ' + (err.message||err), true);
      }
      await refreshData();
      return;
    }
    const ok = await safeSet(STORAGE_KEYS.users, state.data.users, true);
    if(ok){ await pushLog(actor, 'تحديث صلاحيات المستخدمين'); toast('تم حفظ الصلاحيات'); }
    await refreshData();
  });

  // Generic Firestore-collection forms (classes / subjects / announcements)
  const collForm = document.getElementById('collForm');
  if(collForm){
    const collName = collForm.getAttribute('data-coll');
    collForm.querySelector('button.btn-primary').addEventListener('click', async (e)=>{
      e.preventDefault();
      const fd = new FormData(collForm);
      const data = {};
      for(const [k,v] of fd.entries()) data[k] = v;
      const editingId = state.editTarget && state.editTarget.type===collName ? state.editTarget.id : null;
      try{
        if(editingId){
          await fsUpdate(collName, editingId, data);
          state.editTarget = null;
          await pushLog(actor, 'تعديل سجل في: ' + collName);
          toast('تم حفظ التعديل');
        } else {
          await fsAdd(collName, data);
          await pushLog(actor, 'إضافة سجل جديد في: ' + collName);
          toast('تمت الإضافة');
        }
        state.collections[collName] = null; // force refetch
        await ensureCollectionLoaded(collName);
      }catch(err){
        console.error('collection save failed', err);
        toast('تعذر الحفظ: ' + (err.message||err), true);
      }
      render();
    });
  }
  document.querySelectorAll('[data-edit-coll]').forEach(btn=>btn.addEventListener('click', ()=>{
    const [collName, itemId] = btn.getAttribute('data-edit-coll').split(':');
    state.editTarget = {type:collName, id:itemId};
    render();
  }));
  document.querySelectorAll('[data-del-coll]').forEach(btn=>btn.addEventListener('click', ()=>{
    const [collName, itemId] = btn.getAttribute('data-del-coll').split(':');
    showConfirm('هل تريد حذف هذا السجل؟', async ()=>{
      try{
        await fsDelete(collName, itemId);
        state.collections[collName] = null;
        await ensureCollectionLoaded(collName);
        await pushLog(actor, 'حذف سجل من: ' + collName);
        toast('تم الحذف');
      }catch(err){
        console.error('collection delete failed', err);
        toast('تعذر الحذف: ' + (err.message||err), true);
      }
      render();
    });
  }));
}

async function saveContent(actionLabel, actor){
  const ok = await safeSet(STORAGE_KEYS.content, state.data.content, true);
  if(ok){ await pushLog(actor, actionLabel); toast('تم الحفظ — التغييرات ظاهرة الآن في الموقع'); }
  else { toast('حدث خطأ أثناء الحفظ', true); }
  await refreshData();
}

/* ============================= START ============================= */
boot();
</script>
</body>
</html>
